<section class="buscador-omdb">
  <label class="campo">
    <span class="campo__etiqueta">Buscar en OMDb (título o link de IMDb)</span>
    <input
      class="campo__input"
      type="text"
      placeholder="Ej: Interstellar o https://www.imdb.com/title/tt0816692"
      [formControl]="texto"
    />
  </label>

  @if (cargando()) {
    <p class="buscador-omdb__estado">Buscando…</p>
  } @else if (error(); as mensaje) {
    <p class="buscador-omdb__estado buscador-omdb__estado--error">{{ mensaje }}</p>
  } @else if (buscado() && candidatos().length === 0) {
    <p class="buscador-omdb__estado">No se encontraron películas.</p>
  }

  @if (candidatos().length > 0) {
    <ul class="candidatos">
      @for (candidato of candidatos(); track candidato.imdbID) {
        <li>
          <button class="candidato" type="button" (click)="elegir(candidato)">
            @if (posterDe(candidato); as poster) {
              <img class="candidato__poster" [src]="poster" alt="" />
            } @else {
              <span class="candidato__poster candidato__poster--vacio"></span>
            }
            <span class="candidato__titulo">{{ candidato.Title }}</span>
            <span class="candidato__anio">{{ candidato.Year }}</span>
          </button>
        </li>
      }
    </ul>
  }
</section>
