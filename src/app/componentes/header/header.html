<header class="header">
  <a routerLink="/" class="header__titulo-enlace">
    <h1 class="header__titulo">
      <span class="header__titulo-linea">Cine</span>
      <span class="header__titulo-linea">Kimena</span>
    </h1>
  </a>

  <span class="header__separador" aria-hidden="true">|</span>

  <button
    type="button"
    class="header__hamburguesa"
    [attr.aria-expanded]="menuAbierto()"
    aria-label="Abrir menú"
    (click)="alternarMenu()"
  >
    <span class="header__hamburguesa-linea"></span>
    <span class="header__hamburguesa-linea"></span>
    <span class="header__hamburguesa-linea"></span>
  </button>

  <div class="header__menu" [class.header__menu--abierto]="menuAbierto()">
    <nav class="header__acciones">
      <app-boton-link variante="header" ruta="/" fragment="cartelera">Cartelera</app-boton-link>
      <app-boton-link variante="header" ruta="/proximamente">Próximamente</app-boton-link>
      @if (auth.esCliente()) {
        <app-boton-link variante="header" ruta="/mis-compras">Mis compras</app-boton-link>
        <app-boton-link variante="header" ruta="/mis-peliculas">Mis películas</app-boton-link>
        <app-boton-link variante="header" ruta="/mis-puntos">Mis puntos</app-boton-link>
      }
      @if (auth.esAdmin()) {
        <app-boton-link variante="header" ruta="/admin">Gestión</app-boton-link>
      }
      @if (auth.esEmpleado() || auth.esAdmin()) {
        <app-boton-link variante="header" ruta="/boleteria">Boletería</app-boton-link>
      }
    </nav>

    <div class="header__sesion">
      @if (auth.usuario()) {
        <app-boton variante="header" (clic)="cerrarSesion()"> Cerrar sesión </app-boton>
      } @else {
        <app-boton variante="header" (clic)="ingresarComoProfesor()">
          Ingresar como Administrador
        </app-boton>
        <app-boton-link variante="header" ruta="/login" [queryParams]="{ volver: router.url }">
          Iniciar sesión
        </app-boton-link>
      }
    </div>
  </div>
</header>
