<header class="header">
  <a routerLink="/" class="header__titulo-enlace">
    <h1 class="header__titulo">CINE KIMENA</h1>
  </a>

  <div class="header__acciones">
    @if (auth.esCliente()) {
      <app-boton-link variante="oscuro-blanco" ruta="/mis-compras">Mis compras</app-boton-link>
    }
    @if (auth.esEmpleado() || auth.esAdmin()) {
      <app-boton-link variante="oscuro-blanco" ruta="/boleteria">Boletería</app-boton-link>
    }
    @if (auth.usuario()) {
      <app-boton variante="oscuro-blanco" (clic)="cerrarSesion()"> Cerrar sesión </app-boton>
    } @else {
      <app-boton variante="oscuro-blanco" (clic)="ingresarComoProfesor()">
        Ingresar como Administrador
      </app-boton>
      <app-boton-link variante="oscuro-blanco" ruta="/login">Iniciar sesión</app-boton-link>
    }
  </div>
</header>
