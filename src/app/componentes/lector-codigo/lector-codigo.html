<div class="busqueda">
  <label class="campo">
    <span class="campo__etiqueta">Código de compra</span>
    <input
      class="campo__input"
      type="text"
      autocapitalize="characters"
      autocomplete="off"
      spellcheck="false"
      [value]="codigo()"
      (input)="codigo.set($any($event.target).value)"
      (keydown.enter)="emitirCodigo()"
    />
  </label>

  <div class="acciones">
    <app-boton variante="menu" [disabled]="buscando()" (clic)="emitirCodigo()">Buscar</app-boton>
    @if (escaneando()) {
      <app-boton variante="claro-negro" (clic)="alternarEscaner()">Cancelar escaneo</app-boton>
    } @else {
      <app-boton variante="icono" ariaLabel="Escanear con cámara" (clic)="alternarEscaner()">
        <img src="/scanner.png" alt="" />
      </app-boton>
    }
  </div>
</div>

<div id="lector-qr" class="lector" [hidden]="!escaneando()"></div>
