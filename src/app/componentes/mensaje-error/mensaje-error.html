@if (errores.mensaje(); as mensaje) {
  <div class="toast-error" role="alert">
    <svg class="toast-error__icono" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5" />
      <path d="M12 7v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="12" cy="16.5" r="0.9" fill="currentColor" />
    </svg>

    <span class="toast-error__texto">{{ mensaje }}</span>

    <button
      class="toast-error__cerrar"
      type="button"
      aria-label="Cerrar"
      (click)="errores.mensaje.set(null)"
    >
      ×
    </button>
  </div>
}
