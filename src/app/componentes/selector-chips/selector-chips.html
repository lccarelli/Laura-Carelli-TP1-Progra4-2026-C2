<div class="chips">
  @for (opcion of opciones; track opcion.valor) {
    <button
      class="chips__boton"
      type="button"
      [class.chips__boton--activo]="seleccionados.has(opcion.valor)"
      [class.chips__boton--rectangular]="variante === 'rectangular'"
      (click)="alternar.emit(opcion.valor)"
    >
      {{ opcion.etiqueta }}
    </button>
  }
</div>
