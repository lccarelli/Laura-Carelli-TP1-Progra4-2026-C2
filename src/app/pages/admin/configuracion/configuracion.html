<main class="pagina">
  <section class="panel-flotante panel--ancho">
    <app-boton-link variante="claro-negro" ruta="/admin" class="panel__volver">
      ← Volver
    </app-boton-link>

    <div class="panel__encabezado">
      <h2 class="panel__titulo">Configuración general</h2>
    </div>

    <section class="config-seccion">
      <h3 class="config-seccion__titulo">Destacadas</h3>
      <p class="config-seccion__ayuda">
        Elegí qué 3 películas se muestran arriba de todo en la home del visitante.
      </p>

      <div class="modo-opciones">
        <button
          type="button"
          class="modo-opcion"
          [class.modo-opcion--activo]="modo() === 'automatico'"
          (click)="elegirModo('automatico')"
        >
          <span class="modo-opcion__titulo">Automático</span>
          <span class="modo-opcion__detalle">
            Las 3 películas con más entradas vendidas en el último mes.
          </span>
        </button>

        <button
          type="button"
          class="modo-opcion"
          [class.modo-opcion--activo]="modo() === 'manual'"
          (click)="elegirModo('manual')"
        >
          <span class="modo-opcion__titulo">Manual</span>
          <span class="modo-opcion__detalle">
            Las películas que marques como destacadas desde el ABM de películas.
          </span>
        </button>
      </div>

      @if (modo() === 'manual') {
        <app-boton-link variante="claro-negro" ruta="/admin/peliculas">
          Ir al ABM de películas
        </app-boton-link>
      }
    </section>

    <section class="config-seccion config-seccion--separada">
      <h3 class="config-seccion__titulo">Cupón de bienvenida</h3>
      <p class="config-seccion__ayuda">
        Descuento que se aplica solo en la primera compra de cada cliente registrado.
      </p>

      <label class="campo">
        <span class="campo__etiqueta">Porcentaje de descuento</span>
        <input
          class="campo__input"
          type="number"
          min="1"
          max="100"
          [value]="porcentajeCupon()"
          (input)="actualizarPorcentajeCupon($any($event.target).value)"
        />
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Edad mínima (vacío = sin restricción)</span>
        <input
          class="campo__input"
          type="number"
          min="0"
          [value]="edadMinimaCupon() ?? ''"
          (input)="actualizarEdadMinimaCupon($any($event.target).value)"
        />
      </label>

      <app-boton variante="menu" (clic)="guardarCupon()">Guardar cupón</app-boton>
    </section>
  </section>
</main>
