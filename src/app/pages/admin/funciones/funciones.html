<main class="pagina">
  <section class="panel-flotante panel--ancho">
    <app-boton-link variante="claro-negro" ruta="/admin" class="panel__volver">
      ← Volver
    </app-boton-link>

    <div class="panel__encabezado">
      <h2 class="panel__titulo">Funciones</h2>
      <app-boton-link variante="mas" ruta="/admin/funciones/nueva" ariaLabel="Nueva función">
        +
      </app-boton-link>
    </div>

    <input
      class="buscador"
      type="text"
      placeholder="Buscar por película..."
      [value]="busqueda()"
      (input)="buscar($any($event.target).value)"
    />

    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr>
            <th class="tabla__col-estado">Estado</th>
            <th>Película</th>
            <th>Funciones</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (fila of filasFiltradas(); track fila.peliculaId) {
            <tr>
              <td class="tabla__col-estado">
                <app-estado-punto [activa]="fila.algunaActiva" />
              </td>
              <td class="tabla__nombre">{{ fila.nombre }}</td>
              <td>{{ fila.cantidad }}</td>
              <td class="tabla__acciones">
                <app-boton-link
                  variante="icono"
                  [ruta]="['/admin/funciones/pelicula', fila.peliculaId]"
                  [ariaLabel]="'Ver funciones de ' + fila.nombre"
                >
                  <img src="/folder.png" alt="" />
                </app-boton-link>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="tabla__vacio" colspan="4">No hay funciones cargadas todavía.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
