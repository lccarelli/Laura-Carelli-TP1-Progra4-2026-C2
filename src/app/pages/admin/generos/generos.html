<main class="pagina">
  <section class="panel-flotante panel--ancho">
    <app-boton-link variante="claro-negro" ruta="/admin" class="panel__volver">
      ← Volver
    </app-boton-link>

    <div class="panel__encabezado">
      <h2 class="panel__titulo">Géneros</h2>
      <app-boton-link variante="mas" ruta="/admin/generos/nueva" ariaLabel="Nuevo género">
        +
      </app-boton-link>
    </div>

    <input
      class="buscador"
      type="text"
      placeholder="Buscar por nombre..."
      [value]="busqueda()"
      (input)="buscar($any($event.target).value)"
    />

    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr>
            <th>Género</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (genero of generosFiltrados(); track genero.id) {
            <tr>
              <td class="tabla__nombre">{{ genero.nombre }}</td>
              <td class="tabla__acciones">
                <app-boton
                  variante="icono-peligro"
                  [ariaLabel]="'Eliminar ' + genero.nombre"
                  (clic)="eliminar(genero.id)"
                >
                  <img src="/trash.png" alt="" />
                </app-boton>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="tabla__vacio" colspan="2">No hay géneros cargados todavía.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
