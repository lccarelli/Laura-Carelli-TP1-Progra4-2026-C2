<main class="pagina pagina--centrada">
  <section class="panel-flotante panel--angosto">
    <div class="panel__encabezado">
      <h2 class="panel__titulo">{{ id() ? 'Editar premio' : 'Nuevo premio' }}</h2>

      @if (id()) {
        <div class="panel__acciones">
          <label class="toggle">
            <input type="checkbox" [checked]="activa()" (change)="alternarActiva()" />
            <span class="toggle__riel"><span class="toggle__perilla"></span></span>
            <span class="toggle__texto">{{ activa() ? 'Activo' : 'Inactivo' }}</span>
          </label>

          <app-boton variante="icono-peligro" ariaLabel="Eliminar premio" (clic)="eliminarPremio()">
            <img src="/trash.png" alt="" />
          </app-boton>
        </div>
      }
    </div>

    <form class="formulario" [formGroup]="formulario" (ngSubmit)="guardar()">
      <label class="campo">
        <span class="campo__etiqueta">Nombre</span>
        <input class="campo__input" type="text" formControlName="nombre" />
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Costo en puntos</span>
        <input class="campo__input" type="number" min="1" formControlName="costo_puntos" />
      </label>

      <div class="campo">
        <span class="campo__etiqueta">Días válidos (vacío = todos los días)</span>
        <app-selector-chips
          [opciones]="diasSemana"
          [seleccionados]="diasSeleccionados()"
          (alternar)="alternarDia($event)"
        />
      </div>

      <label class="campo">
        <span class="campo__etiqueta">Cantidad de entradas (vacío = sin restricción)</span>
        <input
          class="campo__input"
          type="number"
          min="1"
          [value]="formulario.controls.cantidad_entradas.value ?? ''"
          (input)="actualizarCantidadEntradas($any($event.target).value)"
        />
      </label>

      <label class="campo">
        <span class="campo__etiqueta">
          Monto de descuento ($, vacío = no se puede aplicar en el pago, solo se canjea)
        </span>
        <input
          class="campo__input"
          type="number"
          min="0"
          [value]="formulario.controls.monto_descuento.value ?? ''"
          (input)="actualizarMontoDescuento($any($event.target).value)"
        />
      </label>

      <div class="formulario__acciones">
        <app-boton variante="menu" tipo="submit" [disabled]="formulario.invalid">
          {{ id() ? 'Guardar cambios' : 'Crear premio' }}
        </app-boton>

        <app-boton variante="claro-negro" (clic)="cancelar()">Cancelar</app-boton>
      </div>
    </form>
  </section>
</main>
