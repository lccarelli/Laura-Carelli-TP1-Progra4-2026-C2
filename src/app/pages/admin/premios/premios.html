<main class="pagina">
  <section class="panel-flotante panel--ancho">
    <app-boton-link variante="claro-negro" ruta="/admin" class="panel__volver">
      ← Volver
    </app-boton-link>

    <div class="panel__encabezado">
      <h2 class="panel__titulo">Premios</h2>
      <app-boton-link variante="mas" ruta="/admin/premios/nueva" ariaLabel="Nuevo premio">
        +
      </app-boton-link>
    </div>

    <input
      class="buscador"
      type="text"
      placeholder="Buscar por nombre..."
      [value]="busqueda()"
      (input)="buscar($any($event.target).value)"
    />

    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr>
            <th>Premio</th>
            <th>Costo en puntos</th>
            <th>Condiciones</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (premio of premiosFiltrados(); track premio.id) {
            <tr>
              <td class="tabla__nombre">{{ premio.nombre }}</td>
              <td>{{ premio.costo_puntos }}</td>
              <td>{{ condicionesDe(premio) }}</td>
              <td>{{ premio.activa ? 'Activo' : 'Inactivo' }}</td>
              <td class="tabla__acciones">
                <app-boton-link
                  variante="icono"
                  [ruta]="['/admin/premios', premio.id, 'editar']"
                  [ariaLabel]="'Editar ' + premio.nombre"
                >
                  <img src="/compose.png" alt="" />
                </app-boton-link>
                <app-boton
                  variante="icono"
                  [disabled]="enviandoMail() === premio.id"
                  [ariaLabel]="'Avisar por mail ' + premio.nombre"
                  (clic)="avisarPorMail(premio)"
                >
                  <img src="/coupon-black.png" alt="" />
                </app-boton>
                <app-boton
                  variante="icono-peligro"
                  [ariaLabel]="'Eliminar ' + premio.nombre"
                  (clic)="eliminar(premio.id)"
                >
                  <img src="/trash.png" alt="" />
                </app-boton>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="tabla__vacio" colspan="5">No hay premios cargados todavía.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
