<main class="pagina">
  <section class="panel-flotante panel--ancho">
    <app-boton-link variante="claro-negro" ruta="/admin" class="panel__volver">
      ← Volver
    </app-boton-link>

    <div class="panel__encabezado">
      <h2 class="panel__titulo">Salas</h2>
      <app-boton-link variante="mas" ruta="/admin/salas/nueva" ariaLabel="Nueva sala">
        +
      </app-boton-link>
    </div>

    <input
      class="buscador"
      type="text"
      placeholder="Buscar por nombre..."
      [value]="busqueda()"
      (input)="buscar($any($event.target).value)"
    />

    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr>
            <th>Sala</th>
            <th>Butacas</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (sala of salasFiltradas(); track sala.id) {
            <tr>
              <td class="tabla__nombre">{{ sala.nombre }}</td>
              <td>518</td>
              <td class="tabla__acciones">
                <app-boton
                  variante="icono-peligro"
                  [ariaLabel]="'Eliminar ' + sala.nombre"
                  (clic)="eliminar(sala.id)"
                >
                  <img src="/trash.png" alt="" />
                </app-boton>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="tabla__vacio" colspan="3">No hay salas cargadas todavía.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
