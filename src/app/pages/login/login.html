<main class="pagina pagina--centrada pagina-login">
  <section class="tarjeta">
    <img class="tarjeta__icon" src="pop-corn.png" alt="" aria-hidden="true" />
    <span class="tarjeta__circulo" aria-hidden="true"></span>

    <h2 class="tarjeta__titulo">iniciar<br />sesión</h2>

    <form class="tarjeta__form" [formGroup]="formulario" (ngSubmit)="enviar()">
      <label class="campo">
        <span class="campo__etiqueta">Email</span>
        <input class="campo__input" type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Contraseña</span>
        <div class="campo__con-boton">
          <input
            class="campo__input"
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="campo__boton-ojo"
            (click)="alternarMostrarPassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarPassword()) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a17.7 17.7 0 0 1-2.44 3.47M6.61 6.61A17.85 17.85 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </label>

      <app-boton variante="menu" tipo="submit" [disabled]="formulario.invalid">
        Ingresar
      </app-boton>
    </form>

    <app-boton-link class="acceso-registro" variante="claro-negro" ruta="/registro">
      Registrarme
    </app-boton-link>
  </section>
</main>
