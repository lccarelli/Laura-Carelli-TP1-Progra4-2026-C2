<main class="pagina">
  <section class="panel panel--ancho">
    <h2 class="panel__titulo">Cartelera</h2>

    <div class="grilla">
      @for (pelicula of peliculasActivas(); track pelicula.id) {
        <a class="tarjeta-pelicula" [routerLink]="['/peliculas', pelicula.id]">
          @if (pelicula.imagen_url) {
            <img class="tarjeta-pelicula__imagen" [src]="pelicula.imagen_url" alt="" />
          } @else {
            <div class="tarjeta-pelicula__imagen tarjeta-pelicula__imagen--vacia"></div>
          }
          <span class="tarjeta-pelicula__nombre">{{ pelicula.nombre }}</span>
        </a>
      } @empty {
        <p class="grilla__vacio">No hay películas en cartelera todavía.</p>
      }
    </div>
  </section>
</main>
