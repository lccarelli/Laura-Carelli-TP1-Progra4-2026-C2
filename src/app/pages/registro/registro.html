<main class="pagina pagina--centrada">
  <section class="tarjeta">
    <img class="tarjeta__asterisco" src="icono-popcorn.png" alt="" aria-hidden="true" />
    <span class="tarjeta__circulo" aria-hidden="true"></span>

    <h2 class="tarjeta__titulo">Crear<br />cuenta</h2>

    @if (registrado()) {
      <p class="mensaje-exito">
        ¡Listo! Revisá tu correo para confirmar la cuenta antes de iniciar sesión.
      </p>
      <app-boton-link variante="menu" ruta="/login">Ir a iniciar sesión</app-boton-link>
    } @else {
      <form class="tarjeta__form" [formGroup]="formulario" (ngSubmit)="enviar()">
        <label class="campo">
          <span class="campo__etiqueta">Email</span>
          <input class="campo__input" type="email" formControlName="email" autocomplete="email" />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Contraseña</span>
          <input
            class="campo__input"
            type="password"
            formControlName="password"
            autocomplete="new-password"
          />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Confirmar contraseña</span>
          <input
            class="campo__input"
            type="password"
            formControlName="confirmarPassword"
            autocomplete="new-password"
          />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Nombre</span>
          <input class="campo__input" type="text" formControlName="nombre" />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Apellido</span>
          <input class="campo__input" type="text" formControlName="apellido" />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Fecha de nacimiento</span>
          <input class="campo__input" type="date" formControlName="fecha_nacimiento" />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Tipo de sangre</span>
          <select class="campo__input" formControlName="tipo_sangre">
            <option value="" disabled>Elegí una opción</option>
            @for (tipo of tiposDeSangre; track tipo) {
              <option [value]="tipo">{{ tipo }}</option>
            }
          </select>
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Color de ojos</span>
          <input class="campo__input" type="text" formControlName="color_ojos" />
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Días de vacaciones por año</span>
          <input class="campo__input" type="number" formControlName="dias_vacaciones" min="0" />
        </label>

        <app-boton variante="menu" tipo="submit" [disabled]="formulario.invalid">
          Crear cuenta
        </app-boton>
      </form>

      <app-boton-link class="acceso-login" variante="claro-negro" ruta="/login">
        Ya tengo cuenta
      </app-boton-link>
    }
  </section>
</main>
