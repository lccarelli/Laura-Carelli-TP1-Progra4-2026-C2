<main class="pagina pagina--centrada">
  <section class="tarjeta tarjeta--ancha">
    <img class="tarjeta__asterisco" src="icono-popcorn.png" alt="" aria-hidden="true" />
    <span class="tarjeta__circulo" aria-hidden="true"></span>

    <h2 class="tarjeta__titulo">Registrarme</h2>

    @if (registrado()) {
      <p class="mensaje-exito">
        ¡Listo! Revisá tu correo para confirmar la cuenta antes de iniciar sesión.
      </p>
      <app-boton-link variante="menu" ruta="/login">Ir a iniciar sesión</app-boton-link>
    } @else {
      <form class="tarjeta__form" [formGroup]="formulario" (ngSubmit)="enviar()">
        <label class="campo">
          <span class="campo__etiqueta">Email</span>
          <input class="campo__input" type="email" formControlName="email" autocomplete="email" />
          @if (mensajeDeError('email'); as mensaje) {
            <span class="campo__error">{{ mensaje }}</span>
          }
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Contraseña</span>
          <div class="campo__con-boton">
            <input
              class="campo__input"
              [type]="mostrarPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="campo__boton-ojo"
              (click)="alternarMostrarPassword()"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (mostrarPassword()) {
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a17.7 17.7 0 0 1-2.44 3.47M6.61 6.61A17.85 17.85 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>

          <ul class="campo__requisitos">
            @for (requisito of requisitosPassword; track requisito.clave) {
              <li [class.campo__requisito--cumplido]="cumpleRequisito(requisito.clave)">
                {{ requisito.etiqueta }}
              </li>
            }
          </ul>
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Confirmar contraseña</span>
          <input
            class="campo__input"
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="confirmarPassword"
            autocomplete="new-password"
          />
          @if (mensajeDeError('confirmarPassword'); as mensaje) {
            <span class="campo__error">{{ mensaje }}</span>
          }
        </label>

        <div class="campo-grupo">
          <label class="campo">
            <span class="campo__etiqueta">Nombre</span>
            <input class="campo__input" type="text" formControlName="nombre" />
            @if (mensajeDeError('nombre'); as mensaje) {
              <span class="campo__error">{{ mensaje }}</span>
            }
          </label>

          <label class="campo">
            <span class="campo__etiqueta">Apellido</span>
            <input class="campo__input" type="text" formControlName="apellido" />
            @if (mensajeDeError('apellido'); as mensaje) {
              <span class="campo__error">{{ mensaje }}</span>
            }
          </label>
        </div>

        <div class="campo-grupo">
          <label class="campo">
            <span class="campo__etiqueta">Fecha de nacimiento</span>
            <input
              class="campo__input"
              type="date"
              formControlName="fecha_nacimiento"
              [max]="hoy"
            />
            @if (mensajeDeError('fecha_nacimiento'); as mensaje) {
              <span class="campo__error">{{ mensaje }}</span>
            }
          </label>

          <label class="campo">
            <span class="campo__etiqueta">Días de vacaciones por año</span>
            <input
              class="campo__input"
              type="number"
              formControlName="dias_vacaciones"
              min="0"
              max="100"
            />
            @if (mensajeDeError('dias_vacaciones'); as mensaje) {
              <span class="campo__error">{{ mensaje }}</span>
            }
          </label>
        </div>

        <div class="campo-grupo">
          <label class="campo">
            <span class="campo__etiqueta">Tipo de sangre</span>
            <select class="campo__input" formControlName="tipo_sangre">
              <option value="" disabled>Elegí una opción</option>
              @for (tipo of tiposDeSangre; track tipo) {
                <option [value]="tipo">{{ tipo }}</option>
              }
            </select>
            @if (mensajeDeError('tipo_sangre'); as mensaje) {
              <span class="campo__error">{{ mensaje }}</span>
            }
          </label>

          <label class="campo">
            <span class="campo__etiqueta">Color de ojos</span>
            <select class="campo__input" formControlName="color_ojos">
              <option value="" disabled>Elegí una opción</option>
              @for (color of coloresDeOjos; track color) {
                <option [value]="color">{{ color }}</option>
              }
            </select>
            @if (mensajeDeError('color_ojos'); as mensaje) {
              <span class="campo__error">{{ mensaje }}</span>
            }
          </label>
        </div>

        <app-boton variante="menu" tipo="submit" [disabled]="formulario.invalid">
          Registrarme
        </app-boton>
      </form>

      <app-boton-link class="acceso-login" variante="claro-negro" ruta="/login">
        Ya tengo cuenta
      </app-boton-link>
    }
  </section>
</main>
